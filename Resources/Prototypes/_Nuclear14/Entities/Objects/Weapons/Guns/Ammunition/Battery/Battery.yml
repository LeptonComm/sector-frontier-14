#MARK: MF
- type: entity
  name: microfusion cell
  description: A small energy container the size of a palm, commonly used has ammo for any kind of laser weapon.
  N14PowerCellHigh
  suffix: Full
  parent: N14BasePowerCell
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/microfusion.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ] #TODO: Fix C# script to work with microfusion and lasercell
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
  - type: HitscanBatteryAmmoProvider #Lua
    proto: DSLuaRedHighLaser

- type: entity #Lua
  parent: BasicHitscan
  categories: [ HideSpawnMenu ]
  LuaRedHighLaser
  components:
  - type: HitscanBasicDamage
    damage:
      types:
        Heat: 15
        Radiation: 10
  - type: HitscanBasicVisuals
    muzzleFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: muzzle_beam_heavy
    travelFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: beam_heavy
    impactFlash:
      sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
      state: impact_beam_heavy

#MARK: Fusion Cell

- type: entity
  name: fusion cell
  description: A large energy container the size of a hand, commonly used as ammo for heavy laser weapons.
  N14PowerCellFusion
  suffix: Full
  parent: N14BasePowerCell
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/fusion.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
  - type: Tag
    tags:
      - N14PowerCellFusion
      - N14AmmoCell
  - type: Battery
    maxCharge: 5000
    startingCharge: 5000
  - type: Item
    size: Small
  - type: HitscanBatteryAmmoProvider
    proto: DSLuaRedHighLaser #Lua NFRedMediumLaser<LuaRedHighLaser
    fireCost: 50

- type: entity
  name: plasma cartridge
  description: A small green glowing cartridge, commonly used has ammo for any kind of plasma weapon.
  N14BasePlasmaCell
  abstract: true
  parent: BaseItem
  components:
  - type: Battery
    pricePerJoule: 0.15
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/plasma.rsi
  - type: Tag
    tags:
      - N14PlasmaCartridge
      - N14AmmoCell
  - type: SolutionContainerManager
    solutions:
      battery:
        maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Extractable
    juiceSolution:
      reagents:
        - ReagentId: Zinc
          Quantity: 5
  - type: Appearance
  - type: PowerCellVisuals
  - type: Riggable
  - type: ProjectileBatteryAmmoProvider
    proto: DSBulletPlasma
    fireCost: 100

- type: entity
  name: plasma cartridge
  description: A small green glowing cartridge, commonly used has ammo for any kind of plasma weapon.
  N14PlasmaCartridge
  suffix: Full
  parent: DSN14BasePlasmaCell
  components:
  - type: Sprite
    sprite: _Nuclear14/Objects/Weapons/Guns/Ammunition/Battery/plasma.rsi
    layers:
      - map: [ "enum.PowerCellVisualLayers.Base" ]
        state: empty
      - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
        state: o2
        shader: unshaded
  - type: Battery
    maxCharge: 1200
    startingCharge: 1200
