- type: entity
  parent: [BaseC3Contraband, DSCMBaseWeaponRifle]
  name: M54C assault rifle MK2
  id: DSWeaponRifleM54C
  description: The standard issue rifle of the Marines. Commonly carried by most combat personnel. Uses 10x24mm caseless ammunition.
  suffix: МК, НЕ СПАВНИТЬ
  components:
  - type: HeldSpeedModifier
    walkModifier: 0.88
    sprintModifier: 0.88
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m54c.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m54c.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    minAngle: 1
    maxAngle: 10
    angleIncrease: 1
    angleDecay: 1
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      collection: CMM54CShoot
  # - type: RMCSelectiveFire
  #   baseFireModes:
  #   - SemiAuto
  #   - Burst
  #   - FullAuto
  #   recoilUnwielded: 4
  #   scatterWielded: 6
  #   scatterUnwielded: 20
  #   baseFireRate: 4
  #   burstScatterMult: 1
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: DSCMMagazineRifleM54C
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazineRifleM54C
          - CMMagazineRifleM54CAP
          - CMMagazineRifleM54CExt
  # - type: GunDamageModifier
  #   multiplier: 1.1
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.75, 0.00
      rmc-aslot-rail: 0.06, 0.185
      rmc-aslot-stock: -0.84, 0.0325
      rmc-aslot-underbarrel: 0.25, -0.343
