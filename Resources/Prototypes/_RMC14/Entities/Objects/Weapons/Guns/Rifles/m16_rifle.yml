- type: entity
  parent: [BaseC2ExpeditionContraband, DSCMBaseWeaponRifle]
  id: DSWeaponRifleM16 # TODO: Make the M16 grenadier rifle when impact nades exist
  name: M16 rifle
  description: An old, reliable design first adopted by the U.S. military in the 1960s. Something like this belongs in a museum of war history. It is chambered in 5.56x45mm.
  suffix: МК, НЕ СПАВНИТЬ
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m16.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - sprite: _RMC14/Objects/Weapons/Guns/Attachments/stock.rsi # TODO RMC14 effects
      state: m16-stock
      offset: -0.5, 0
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m16.rsi
  - type: Item #Lua
    shape:
    - 0,0,3,2
  - type: Gun
    examineCaliber: gun-examine-caliber-55645 #Lua
    fireRate: 8.4 #Lua
#    minAngle: 1 # comment from _Lua
#    maxAngle: 30
#    angleIncrease: 5
#    angleDecay: 10
    minAngle: 1 #Lua
    maxAngle: 3.5 #Lua
    angleIncrease: 0.2 #Lua
    angleDecay: 1 #Lua
    selectedMode: FullAuto #Lua SemiAuto<FullAuto
    availableModes:
    - SemiAuto
    - FullAuto #Lua
#    - Burst
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m16.ogg
  # - type: RMCSelectiveFire
  #   baseFireModes:
  #   - SemiAuto
  #   - Burst
  #   recoilUnwielded: 3
  #   scatterWielded: 2
  #   scatterUnwielded: 20
  #   baseFireRate: 4
  #   burstScatterMult: 2
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject: null
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: DSMagazine556x45mmFMJ #Lua RMCMagazineRifleM16<Magazine556x45mmFMJ
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - Magazine556x45mmFMJ #Lua RMCMagazineRifleM16<Magazine556x45mmFMJ
  # - type: GunDamageModifier
  #   multiplier: 1.3
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.81, -0.03
      rmc-aslot-rail: -0.15, 0.12
