    role: DSCadet
    time: 72000 # 20h
#    - !type:OverallPlaytimeRequirement # comment from _Lua
#      time: 43200 # 12 hours
#    - !type:DepartmentTimeRequirement
#      department: Security
#      time: 21600 # 6 hours
