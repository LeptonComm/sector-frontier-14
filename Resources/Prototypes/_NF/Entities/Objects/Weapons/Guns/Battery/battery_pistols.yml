  name: laser pistol
  description: |-
    An older model of civilian-grade laser pistol with two settings: disable and kill.
  suffix: МК, НЕ СПАВНИТЬ
  components:
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Battery/laser_pistol.rsi
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/Battery/laser_pistol.rsi
  - type: Item
    size: Small
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right
      - state: inhand-right-unshaded
        shader: unshaded
  - type: Gun #Lua
    minAngle: 3.1 #Lua
    maxAngle: 15.5 #Lua
    angleIncrease: 0.7 #Lua
    angleDecay: 5 #Lua
    fireRate: 3

