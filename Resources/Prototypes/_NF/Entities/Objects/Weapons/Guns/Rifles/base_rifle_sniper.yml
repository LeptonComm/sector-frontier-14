    capacity: 10 #Lua 5<10
    proto: DSCartridge127x99mm #Lua NFCartridgeRifle60<Cartridge127x99mm
    whitelist:
      tags:
      - Cartridge127x99mm #Lua NFCartridgeRifle60<Cartridge127x99mm
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
