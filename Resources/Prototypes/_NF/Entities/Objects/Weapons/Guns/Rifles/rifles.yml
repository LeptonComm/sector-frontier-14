#region DeltaV
- type: entity
  id: DSNFWeaponRifleCeremonial
  parent: [ NFBaseWeaponRifleChamber556x45, NFBaseWeaponFrameRifleFrontierGunsmith ] #Lua 20 -> 556x45
  name: ceremonial rifle
  description: A ceremonial variant of the Mark 1 Rifle, in tasteful blue and white.
  suffix: МК, НЕ СПАВНИТЬ
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Rifles/ceremonial_grand.rsi
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Rifles/ceremonial_grand.rsi
  - type: Gun #Lua
    fireRate: 2.4
  - type: BallisticAmmoProvider #Lua
    capacity: 15
    proto: DSCartridge762x54mmRFMJ
    whitelist:
      tags:
      - Cartridge762x54mmRFMJ

#region Frontier
- type: entity
  id: DSNFWeaponRifleRepeater
  parent: [ NFBaseWeaponRifleChamber556x45, NFBaseWeaponFrameRifleFrontierGunsmith ] #Lua 20 -> 556x45
  name: N2524 pattern repeater
  description: A civilian grade lever action firearm, favored by space cowboys across the Frontier for its reliability.
  suffix: МК, НЕ СПАВНИТЬ
  components:
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Rifles/repeater.rsi
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/Rifles/repeater.rsi
#  - type: BallisticAmmoProvider # comment from _Lua
#    capacity: 8
  - type: Item #Lua
    shape:
    - 0,0,4,3
  - type: Gun #Lua
    examineCaliber: gun-examine-caliber-127 #Lua
    minAngle: 1.4 #Lua
    maxAngle: 7 #Lua
    angleIncrease: 5.6 #Lua
    angleDecay: 3.7 #Lua
    fireRate: 0.9
  - type: BallisticAmmoProvider #Lua
    capacity: 15
    proto: DSCartridge127x99mm
    whitelist:
      tags:
      - Cartridge127x99mm
  - type: ItemToggle #Lua
    onUse: false
    onActivate: false
    soundActivate:
      path: /Audio/_Lua/Weapons/mantison.wav
      params:
        volume: 3
    soundDeactivate:
      path: /Audio/_Lua/Weapons/mantisoff.wav
      params:
        volume: 3
  - type: ToggleClothing #Lua
    action: ActionToggleScope
    mustEquip: false
  - type: ComponentToggler #Lua
    components:
    - type: ClothingSpeedModifier #Lua
      walkModifier: 0.8
      sprintModifier: 0.8
    - type: CursorOffsetRequiresWield
    - type: EyeCursorOffset
      maxOffset: 5
      pvsIncrease: 1
