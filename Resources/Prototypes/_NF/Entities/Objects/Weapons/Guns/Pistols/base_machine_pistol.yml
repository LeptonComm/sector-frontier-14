#region frame
- type: entity
  abstract: true
  parent: [ NFBaseWeaponEncumbranceMachinePistol, NFBaseGunMeleeAttackLow, NFBaseItemWeaponGunMagazineFed ]
  id: DSNFBaseWeaponFrameMachinePistol
  name: machine pistol
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      collection: PistolsPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: PistolsDrop
  - type: EmitSoundOnLand
    sound:
      collection: PistolsDrop
  # Goobstation edit end
  - type: Gun
    projectileSpeed: 30 #Lua
    minAngle: 3.1
    maxAngle: 15.5
    angleIncrease: 0.8
    angleDecay: 4
    fireRate: 4
    burstFireRate: 5
    shotsPerBurst: 3
    burstCooldown: 1
    selectedMode: SemiAuto #Lua FullAuto<SemiAuto
    availableModes:
    - SemiAuto #Lua
#    - FullAuto # comment from _Lua
#    - Burst
  - type: NFWeaponDetails
    class: weapon-details-class-machine-pistol

