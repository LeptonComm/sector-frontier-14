#region frame
- type: entity
  abstract: true
  parent: [ NFBaseWeaponEncumbrancePistol, NFBaseGunMeleeAttackLow, NFBaseItemWeaponGunMagazineFed ]
  NFBaseWeaponFramePistol
  name: pistol
  components:
  # Goobstation edit start
  - type: EmitSoundOnPickup
    sound:
      collection: PistolsPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: PistolsDrop
  - type: EmitSoundOnLand
    sound:
      collection: PistolsDrop
  # Goobstation edit end
  - type: Gun
    projectileSpeed: 40 #Lua
    minAngle: 2.7
    maxAngle: 13.5
    angleIncrease: 0.7
    angleDecay: 3.5
    fireRate: 4
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: StaticPrice
    price: 250
  - type: NFWeaponDetails
    class: weapon-details-class-pistol
  - type: FireOnLand # DeltaV - gun safety

#region manufacturer
- type: entity
  abstract: true
  parent: DSNFBaseWeaponFramePistol
  NFBaseWeaponFramePistolNanotrasen
  components:
  - type: Gun
    minAngle: 3.1
    maxAngle: 15.5
    angleIncrease: 1
    angleDecay: 3.4
    fireRate: 3.4
  - type: NFWeaponDetails
    manufacturer: weapon-details-manufacturer-nanotrasen-munitions

- type: entity
  abstract: true
  parent: [ BaseC3SyndicateContraband, DSNFBaseWeaponFramePistol ]
  NFBaseWeaponFramePistolCybersun
  components:
  - type: Gun
    angleIncrease: 0.8
    angleDecay: 5.6
    fireRate: 3.2
  - type: NFWeaponDetails
    manufacturer: weapon-details-manufacturer-cybersun-industries
