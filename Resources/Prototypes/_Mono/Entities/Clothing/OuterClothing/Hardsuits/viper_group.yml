- type: entity
  parent: [ClothingOuterHardsuitBase, BaseC3SyndicateContraband]
  id: ClothingOuterHardsuitViperGroupStandard
  name: JACKAL mk.II viper hardsuit
  description: A hardsuit adorned with signature markings of the Viper Group. The armor is remarkably nimble for the protection it offers.
  suffix: Pirate, Medium, Special #Lua
  components:
  - type: Sprite
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/viper_group_standard.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Mono/Clothing/OuterClothing/Hardsuits/viper_group_standard.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        #Mechanical 30/30/30//55/55//50/50//50/10 summ = 350 for pirate hardsuits
        Blunt: 0.7 #Lua 0.6<0.7
        Slash: 0.7 #Lua 0.55<0.7
        Piercing: 0.7 #Lua 0.45<0.7
        #Physical
        Heat: 0.45 #Lua 0.4<0.45
        Radiation: 0.45 #Lua 0.4<0.45
        #Special
        Shock: 0.5 #Lua
        Caustic: 0.5 #Lua 0.45<0.5
  - type: StaminaDamageResistance # Mono - Stamres
    coefficient: 0.5 #Lua 0.4<0.5
  - type: ClothingSpeedModifier
    walkModifier: 0.9 #Lua 0.95<0.9
    sprintModifier: 0.9 #Lua 0.95<0.9
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitViperGroupStandard
  - type: StaticPrice
    price: 1500
    vendPrice: 4000
  - type: Inject
    openCloseDelay: 1
    autoClose: true
    autoCloseDelay: 3
  - type: HardsuitIdentification
  - type: HardsuitDNARadial
  - type: Speech
  - type: TTS
    voice: Adjutant
  - type: ThermalCloak
    enabled: false

