# Base
- type: entity
  BaseSpeedLoader45_magnum
  name: "speed loader (.45 magnum)"
  suffix: МК, НЕ СПАВНИТЬ #Lua
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - SpeedLoader45_magnumFMJ
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Cartridge45_magnumFMJ
    capacity: 6
  - type: Sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

# Standart
- type: entity
  SpeedLoader45_magnumFMJ
  name: "speed loader (.45 magnum FMJ)"
  parent: DSBaseSpeedLoader45_magnum
  components:
  - type: BallisticAmmoProvider
    proto: DSCartridge45_magnumFMJ
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/SpeedLoaders/45_magnum/45_magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: base
    steps: 7
    zeroVisible: false
  - type: Appearance

- type: entity
  SpeedLoader45_magnumEmpty
  name: "speed loader (.45 magnum any)"
  parent: DSSpeedLoader45_magnumFMJ
  components:
  - type: BallisticAmmoProvider
    proto: null
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/SpeedLoaders/45_magnum/45_magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      # TODO: This is actually a issue with all the speed loaders:
      #       You can mix different ammo types, but it will always
      #       use the one it was printed for.
      - state: base-6
        map: [ "enum.GunVisualLayers.Mag" ]

