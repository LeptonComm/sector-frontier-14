- type: entity
  id: DSBaseSpeedLoader9x19mm
  name: "speed loader (9x19mm FMJ)"
  suffix: МК, НЕ СПАВНИТЬ #Lua
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - SpeedLoader9x19mmFMJ
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Cartridge9x19mmFMJ
    capacity: 8
  - type: Sprite
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []

- type: entity
  id: DSSpeedLoader9x19mmFMJ
  name: "speed loader (9x19mm FMJ)"
  parent: DSBaseSpeedLoader9x19mm
  components:
  - type: BallisticAmmoProvider
    proto: DSCartridge9x19mmFMJ
  - type: Icon
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/SpeedLoaders/9x19mm/9x19mm.rsi
    state: icon
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/SpeedLoaders/9x19mm/9x19mm.rsi
    layers:
      - state: base
        map: [ "enum.GunVisualLayers.Base" ]
      - state: base-8
        map: [ "enum.GunVisualLayers.Mag" ]
  - type: MagazineVisuals
    magState: base
    steps: 9
    zeroVisible: false
  - type: Appearance

