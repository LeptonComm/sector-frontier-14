# Shotgun Shells
# Standart
- type: entity
  parent: DSAmmoProvider23x75mmShotgunShell
  id: DSAmmoBox23x75mmBeanbag
  name: shotgun shell box (4 gauge beanbag)
  suffix: МК, НЕ СПАВНИТЬ #Lua
  components:
    - type: BallisticAmmoProvider
      proto: DSShellShotgun23x75mmBeanbag
    - type: MagazineVisuals
      magState: mag-beanbag
      steps: 5
      zeroVisible: false
    - type: Sprite
      layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-beanbag-1
        map: ["enum.GunVisualLayers.Mag"]
      - state: beanbag

