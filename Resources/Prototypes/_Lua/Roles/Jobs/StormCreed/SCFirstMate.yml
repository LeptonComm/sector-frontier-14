- type: job
  id: StormCreedFirstmate
  name: job-name-sc-firstmate
  description: job-description-sc-firstmate
  playTimeTracker: JobSCFirstMate
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 129600 # 36 hours
    - !type:DepartmentTimeRequirement
      department: Security
      time: 29800 # 3 hours
    - !type:RoleTimeRequirement
      role: JobSecurityOfficer
      time: 57600 # 16 hours
    - !type:RoleTimeRequirement
      role: Antag
      time: 21600 # 6 hours
  startingGear: SCFirstMateGear
  alwaysUseSpawner: true
  hideConsoleVisibility: true
  canBeAntag: true
  icon: "JobIconNFPirateFirstMate"
  supervisors: job-supervisors-sc-firstmate
  weight: 20
  displayWeight: 20
  setPreference: true
  newPlayerMessage: false
  access:
  - Pirate
  accessGroups:
  - GeneralAccess
  special:
  - !type:AddComponentSpecial
    components:
    - type: SpecialSectorStationRecord # must be given on spawn
      recordGeneration: FalseRecord
    - type: Company
      companyName: None
    - type: DisableSuitSensors
  - !type:AddImplantSpecial
    implants: [ FreelanceTrackingImplant ]
  - !type:GiveItemOnHolidaySpecial # Even pirates get a piece of cake.
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift

- type: startingGear
  id: SCFirstMateGear
  equipment:
    belt: ClothingBeltUtility
    pocket1: BasePirateUplinkPirateCrew
  storage:
    back:
    - AppraisalTool

- type: chameleonOutfit
  id: SCFirstMateChameleonOutfit
  job: StormCreedFirstmate
