- type: vessel
  parent: BaseVessel
  id: BMXeno
  name: BM-Xeno
  description: "Шаттл с тяжелыми артиллерийскими пушками и радаром. Для большой охоты."
  price: 1 #test
  category: Large
  group: ASBlackMarket
  access: Mercenary
  whitelist:
  - Frontier
  class:
  - Mercenary
  engine:
  - AME
  shuttlePath: /Maps/_Lua/Shuttles/Mercenary/Xeno.yml

- type: gameMap
  id: BMXeno
  mapName: 'BM-Xeno'
  mapPath: /Maps/_Lua/Shuttles/Mercenary/Xeno.yml
  minPlayers: 0
  stations:
    BMXeno:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'BM-Xeno {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'



